<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 128">
  <defs>
    <linearGradient id="gold" x1="0" y1="10" x2="92" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2bb"/>
      <stop offset=".28" stop-color="#d6af63"/>
      <stop offset=".58" stop-color="#73542d"/>
      <stop offset=".82" stop-color="#b98b42"/>
      <stop offset="1" stop-color="#ffe08f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="8" x2="76" y2="104" gradientUnits="userSpaceOnUse">
