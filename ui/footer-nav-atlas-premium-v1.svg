      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#c58d35" flood-opacity=".24"/>
    </filter>
    <style>
      .g{fill:none;stroke:url(#gold);stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
      .m{fill:url(#steel);stroke:url(#gold);stroke-linecap:round;stroke-linejoin:round;filter:url(#soft)}
      .d{stroke:#140d05;stroke-linecap:round;stroke-linejoin:round}
      .h{stroke:#fff0b2;stroke-linecap:round;opacity:.45}
    </style>
  </defs>

