      <stop offset="1" stop-color="#cf9f4d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#e3aa43" flood-opacity=".44"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
